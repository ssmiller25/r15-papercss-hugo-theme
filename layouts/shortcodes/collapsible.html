{{- $summary := .Get "summary" -}}
{{- if not $summary -}}
  {{- errorf "shortcode %q: missing required parameter 'summary' at %s" .Name .Position -}}
{{- end -}}
{{- $id := printf "collapsible_%d" .Ordinal -}}
<div class="collapsible">
  <input id="{{ $id }}" type="checkbox" name="{{ $id }}">
  <label for="{{ $id }}">
    {{ $summary | markdownify }}
  </label>
  <div class="collapsible-body">
    {{ .Inner | markdownify }}
  </div>
</div>
