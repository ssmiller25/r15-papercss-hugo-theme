{{- if .TableOfContents -}}
{{- $toc := replaceRE `<nav id="TableOfContents">` `<nav id="TableOfContents" aria-label="Table of contents">` .TableOfContents -}}
<div class="child-borders">
  <div class="toc border">
    <h2 id="toc-heading">Table of contents</h2>
    {{ $toc | safeHTML }}
  </div>
</div>
{{- end -}}
