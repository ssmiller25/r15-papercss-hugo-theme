{{- /* Search Box UI for Hugo site. The opening chomps let the caller's indentation land on the <div> instead of a whitespace-only line of its own. Presentation lives in assets/css/custom.css. */ -}}
{{- if site.Params.enable_search -}}
<div id="search-container">
  <label for="search-box" class="visually-hidden">Search</label>
  <input type="search" id="search-box" placeholder="Search...">
  <div id="search-results" class="paper is-hidden"></div>
</div>
{{- end -}}
