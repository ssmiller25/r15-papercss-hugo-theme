name: CodeQL
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          # CodeQL has no HTML analyzer, and `html` here made init fail with
          # "Did not recognize the following languages: html", so every run of
          # this job errored before analyzing anything. Markup correctness is
          # covered by html-validate in the Web Template Lint workflow instead.
          languages: javascript-typescript
      - name: Autobuild
        uses: github/codeql-action/autobuild@v3
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
