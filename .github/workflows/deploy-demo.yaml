name: Deploy Example Site

on:
  push:
    branches:
      - main
  workflow_dispatch:

# GitHub Pages deployment: build the example site, upload it as the Pages
# artifact, then publish it. The custom domain is served from the CNAME file
# in the built site (exampleSite/static/CNAME) and configured under
# Settings -> Pages.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: true
          fetch-depth: 0 # Fetch all history for .GitInfo and .Lastmod

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build with the same pinned Hugo the theme's gates use, so the demo is
      # rendered exactly as the theme is verified.
      - name: Build the example site
        uses: devcontainers/ci@v0.3
        with:
          cacheFrom: ghcr.io/ssmiller25/r15-papercss-hugo-theme
          push: never
          runCmd: make build-example

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: exampleSite/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
